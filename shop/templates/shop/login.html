{% load static %}

<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ورود / ثبت نام
    </title>


    <!-- Favicon -->

    <link
        rel="icon"
        type="image/png"
        href="{% static 'shop/images/open.jpg' %}"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <!-- Vazirmatn -->

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{% static 'shop/css/login.css' %}"
    >

</head>


<body data-active-tab="{{ active_tab|default:'login' }}">


<!-- =========================
     Header
========================= -->

<header class="header">

    <div class="logo">

        <img
            src="{% static 'shop/images/logo.png' %}"
            alt="لوگوی فروشگاه"
        >

    </div>

</header>



<!-- =========================
     Login Container
========================= -->

<main class="login-container">


    <div class="login-box">


        <!-- User Icon -->

        <div class="user-icon">

            <i class="fas fa-user"></i>

        </div>



        <!-- Title -->

        <h1 id="form-title">

            ورود به حساب کاربری

        </h1>



        <!-- Tabs -->

        <div class="form-tabs">


            <button
                type="button"
                class="tab active"
                id="login-tab"
            >

                ورود

            </button>


            <button
                type="button"
                class="tab"
                id="register-tab"
            >

                ثبت نام

            </button>


        </div>



        <!-- Django Error -->

        {% if error %}

            <div class="message error">

                {{ error }}

            </div>

        {% endif %}



        <!-- JavaScript Message -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- =========================
             Login Form
        ========================= -->

        <form
            id="login-form"
            class="form active-form"
            method="POST"
            action="{% url 'login' %}"
        >

            {% csrf_token %}


            <!-- Phone -->

            <div class="input-box">

                <i class="fas fa-phone"></i>

                <input
                    type="tel"
                    name="phone"
                    id="login-phone"
                    placeholder="شماره تلفن همراه"
                    maxlength="11"
                    inputmode="numeric"
                    autocomplete="tel"
                    required
                >

            </div>



            <!-- Password -->

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    name="password"
                    id="login-password"
                    placeholder="رمز عبور"
                    maxlength="30"
                    autocomplete="current-password"
                    required
                >

            </div>



            <!-- Remember -->

            <div class="remember">

                <label>

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    مرا به خاطر بسپار

                </label>


                <a href="#">

                    فراموشی رمز عبور؟

                </a>

            </div>



            <!-- Login Button -->

            <button
                type="submit"
                class="main-button"
            >

                ورود

            </button>


        </form>



        <!-- =========================
             Register Form
        ========================= -->

        <form
            id="register-form"
            class="form"
            method="POST"
            action="{% url 'register' %}"
        >

            {% csrf_token %}


            <!-- First Name -->

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input
                    type="text"
                    name="first_name"
                    id="first-name"
                    placeholder="نام"
                    maxlength="30"
                    autocomplete="given-name"
                    required
                >

            </div>



            <!-- Last Name -->

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input
                    type="text"
                    name="last_name"
                    id="last-name"
                    placeholder="نام خانوادگی"
                    maxlength="50"
                    autocomplete="family-name"
                    required
                >

            </div>



            <!-- Phone -->

            <div class="input-box">

                <i class="fas fa-phone"></i>

                <input
                    type="tel"
                    name="phone"
                    id="register-phone"
                    placeholder="شماره تلفن همراه"
                    maxlength="11"
                    inputmode="numeric"
                    autocomplete="tel"
                    required
                >

            </div>



            <!-- Address -->

            <div class="input-box">

                <i class="fas fa-location-dot"></i>

                <input
                    type="text"
                    name="address"
                    id="register-address"
                    placeholder="آدرس"
                    maxlength="200"
                    autocomplete="street-address"
                    required
                >

            </div>



            <!-- Password -->

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    name="password"
                    id="register-password"
                    placeholder="رمز عبور"
                    maxlength="30"
                    autocomplete="new-password"
                    required
                >

            </div>



            <!-- Confirm Password -->

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="تکرار رمز عبور"
                    maxlength="30"
                    autocomplete="new-password"
                    required
                >

            </div>



            <!-- Register Button -->

            <button
                type="submit"
                class="main-button"
            >

                ثبت نام

            </button>


        </form>



        <!-- =========================
             Back To Store
        ========================= -->

        <a
            href="{% url 'shop_home' %}"
            class="back-store"
        >

            <i class="fas fa-arrow-right"></i>

            بازگشت به فروشگاه

        </a>


    </div>


</main>



<!-- JavaScript -->

<script
    src="{% static 'shop/js/login.js' %}"
></script>


</body>

</html>
