{% load static %}

<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>حساب کاربری</title>

<link rel="icon"
      type="image/png"
      href="{% static 'shop/images/acc.jpg' %}">


<!-- Font Awesome -->

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<!-- Vazirmatn -->

<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">


<!-- CSS -->

<link rel="stylesheet"
      href="{% static 'shop/css/account.css' %}">


</head>

<body>

<!-- سربرگ -->

<header class="header">

    <div class="logo">

        <img
            src="{% static 'shop/images/logo.png' %}"
            alt="لوگوی فروشگاه">

    </div>

</header>



<!-- حساب کاربری -->

<main class="account-container">


    <div class="account-box">


        <!-- آیکون کاربر -->

        <div class="user-icon">

            <i class="fas fa-user"></i>

        </div>



        <!-- عنوان -->

        <h1>
            حساب کاربری
        </h1>


        <p class="welcome">
            به حساب کاربری خود خوش آمدید
        </p>



        <!-- اطلاعات کاربر -->

        <div class="user-info">


            <!-- نام -->

            <div class="info-item">

                <div>

                    <i class="fas fa-user"></i>

                    <span>
                        نام
                    </span>

                </div>

                <strong id="first-name">
                    -
                </strong>

            </div>



            <!-- نام خانوادگی -->

            <div class="info-item">

                <div>

                    <i class="fas fa-user"></i>

                    <span>
                        نام خانوادگی
                    </span>

                </div>

                <strong id="last-name">
                    -
                </strong>

            </div>



            <!-- شماره موبایل -->

            <div class="info-item">

                <div>

                    <i class="fas fa-phone"></i>

                    <span>
                        شماره موبایل
                    </span>

                </div>

                <strong id="phone">
                    -
                </strong>

            </div>



            <!-- آدرس -->

            <div class="info-item">

                <div>

                    <i class="fas fa-location-dot"></i>

                    <span>
                        آدرس
                    </span>

                </div>

                <strong id="address">
                    -
                </strong>

            </div>


        </div>



        <!-- پیام -->

        <div id="account-message"
             class="account-message">

        </div>



        <!-- عملیات -->

        <div class="account-actions">


            <!-- ویرایش -->

            <button
                type="button"
                id="edit-button">

                <i class="fas fa-user-edit"></i>

                ویرایش اطلاعات

            </button>



            <!-- سفارش ها -->

            <button
                type="button">

                <i class="fas fa-shopping-bag"></i>

                سفارش‌های من

            </button>



            <!-- خروج -->

            <button
                type="button"
                class="logout"
                id="logout-button">

                <i class="fas fa-sign-out-alt"></i>

                خروج از حساب

            </button>


        </div>



        <!-- فرم ویرایش -->

        <form
            id="edit-form"
            class="edit-form">


            <h2>
                ویرایش اطلاعات
            </h2>



            <!-- نام -->

            <div class="edit-input-box">

                <i class="fas fa-user"></i>

                <input
                    type="text"
                    id="edit-first-name"
                    placeholder="نام">

            </div>



            <!-- نام خانوادگی -->

            <div class="edit-input-box">

                <i class="fas fa-user"></i>

                <input
                    type="text"
                    id="edit-last-name"
                    placeholder="نام خانوادگی">

            </div>



            <!-- شماره موبایل -->

            <div class="edit-input-box">

                <i class="fas fa-phone"></i>

                <input
                    type="tel"
                    id="edit-phone"
                    placeholder="شماره موبایل"
                    maxlength="11"
                    dir="ltr">

            </div>



            <!-- آدرس -->

            <div class="edit-input-box">

                <i class="fas fa-location-dot"></i>

                <input
                    type="text"
                    id="edit-address"
                    placeholder="آدرس"
                    maxlength="200">

            </div>



            <!-- دکمه ها -->

            <div class="edit-actions">


                <button
                    type="submit"
                    class="save-button">

                    <i class="fas fa-check"></i>

                    ذخیره تغییرات

                </button>



                <button
                    type="button"
                    id="cancel-edit"
                    class="cancel-button">

                    <i class="fas fa-times"></i>

                    انصراف

                </button>


            </div>


        </form>



        <!-- بازگشت به فروشگاه -->

        <a
            href="{% url 'shop_home' %}"
            class="back-store">

            <i class="fas fa-arrow-right"></i>

            بازگشت به فروشگاه

        </a>


    </div>


</main>



<!-- JavaScript -->

<script src="{% static 'shop/js/account.js' %}"></script>


</body>

</html>
